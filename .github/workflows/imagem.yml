name: Imagem de producao

# Compila a imagem Docker do app AQUI no GitHub e guarda no registro do GitHub
# (ghcr.io). O VPS nao compila mais nada: `scripts/atualizar-vps.sh` so baixa a
# imagem pronta do commit e troca o contêiner (~30 s em vez de 10+ min).
# Cada imagem leva a tag do commit (sha completo) e a `latest`.
on:
  push:
    branches: ['claude/claude-md-opcao-x-98kfj5']
  workflow_dispatch:

# Uma compilacao por vez: duas pushes seguidas nao disputam a tag `latest`.
concurrency:
  group: imagem-producao
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # As NEXT_PUBLIC_* sao embutidas no bundle no momento do build (sao publicas,
      # vao para o navegador). Ficam em Settings -> Secrets and variables -> Actions
      # -> Variables (ou Secrets). Sem elas a imagem sairia apontando para lugar nenhum.
      - name: Conferir as variaveis do build
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          falta=0
          [ -n "$URL" ]  || { echo "::error::Falta NEXT_PUBLIC_SUPABASE_URL nas Variables do repositorio"; falta=1; }
          [ -n "$ANON" ] || { echo "::error::Falta NEXT_PUBLIC_SUPABASE_ANON_KEY nas Variables do repositorio"; falta=1; }
          exit $falta

      - name: Nome da imagem
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
            ${{ steps.nome.outputs.imagem }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_BUCKET_SINISTROS=${{ vars.NEXT_PUBLIC_SUPABASE_BUCKET_SINISTROS || secrets.NEXT_PUBLIC_SUPABASE_BUCKET_SINISTROS || 'sinistros-docs' }}
          # Cache das camadas no proprio GitHub: o `npm ci` so roda de novo quando o
          # package-lock muda.
          cache-from: type=gha
          cache-to: type=gha,mode=max
